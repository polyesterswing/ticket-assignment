services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: clearfeed
      POSTGRES_PASSWORD: clearfeed
      POSTGRES_DB: clearfeed
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearfeed -d clearfeed"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
