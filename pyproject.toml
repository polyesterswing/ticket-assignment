[project]
name = "clearfeed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "polyesterswing", email = "67583328+polyesterswing@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
clearfeed = "clearfeed:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
