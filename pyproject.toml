[project]
name = "clearfeed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "polyesterswing", email = "67583328+polyesterswing@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
